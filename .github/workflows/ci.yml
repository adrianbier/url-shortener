
name: Docker CI - Build, Scan and Attest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-push:
    name: Build, scan and attest Docker image
    runs-on: ubuntu-latest

    steps:
      # Repository laden
      - name: Checkout repository
        uses: actions/checkout@v4

      # Image-Name festlegen
      - name: Set image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # .NET SDK einrichten
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet-Abhängigkeiten und Lock-Datei erzeugen
      - name: Restore .NET dependencies
        run: dotnet restore --use-lock-file

      # Prüfen, ob die Lock-Datei vorhanden ist
      - name: Check NuGet lock file
        run: |
          test -f packages.lock.json
          ls -lh packages.lock.json

      # Backend-Abhängigkeiten auf Schwachstellen prüfen
      - name: Trivy backend vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      # Docker Buildx einrichten
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bei GitHub Container Registry anmelden
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optimiertes Docker-Image bauen und veröffentlichen
      - name: Build and push optimized image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ASP.NET Core URL shortener demo app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker-Image auf Schwachstellen prüfen
      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      # SBOM mit Trivy generieren
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      # SBOM als GitHub-Artefakt speichern
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: docker-sbom
          path: sbom.cdx.json
          if-no-files-found: error

      # SBOM-Attestation erstellen
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
